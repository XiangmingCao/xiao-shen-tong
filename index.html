<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小神童认字乐园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  @keyframes starBurst {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    100% { transform: scale(2) rotate(180deg); opacity: 0; }
  }
  @keyframes rainbowBorder {
    0% { border-color: #FF6B6B; }
    16% { border-color: #FFD93D; }
    33% { border-color: #6BCB77; }
    50% { border-color: #4D96FF; }
    66% { border-color: #9B59B6; }
    83% { border-color: #FF6B9D; }
    100% { border-color: #FF6B6B; }
  }
  @keyframes celebrationBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-20px) scale(1.1); }
    50% { transform: translateY(0) scale(1); }
    75% { transform: translateY(-10px) scale(1.05); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 5px rgba(107,203,119,0.5); }
    50% { box-shadow: 0 0 15px rgba(107,203,119,0.9); }
  }
  @keyframes pulseWarn {
    0%, 100% { box-shadow: 0 0 5px rgba(255,217,61,0.5); }
    50% { box-shadow: 0 0 15px rgba(255,217,61,0.9); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes petWiggle {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-4px); }
  }
  @keyframes petGlow {
    0%, 100% { filter: drop-shadow(0 12px 18px rgba(46, 125, 50, 0.24)); }
    50% { filter: drop-shadow(0 18px 28px rgba(255, 146, 43, 0.34)); }
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .bg-deco {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-deco span {
    position: absolute; font-size: 30px; opacity: 0.15;
    animation: float 6s ease-in-out infinite;
  }

  .app {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto; padding: 16px;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  /* ====== 顶部 ====== */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0 6px;
    gap: 10px;
  }
  .header h1 {
    color: #fff; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  .header h1 span { font-size: 26px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .lang-toggle {
    background: rgba(255,255,255,0.9); color: #764ba2;
    border: 1px solid rgba(255,255,255,0.95); border-radius: 16px;
    padding: 5px 9px; font-size: 11px; font-weight: 800;
    cursor: pointer; white-space: nowrap;
  }
  .stats { display: flex; gap: 6px; }
  .stat-badge {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 5px 10px;
    color: #fff; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 3px;
  }
  .stat-badge.green { background: rgba(107,203,119,0.3); }
  .stat-badge.red { background: rgba(255,107,107,0.3); }

  /* ====== 文件状态条 ====== */
  .file-status-bar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.12); border-radius: 12px;
    padding: 8px 14px; margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .file-status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #FFD93D; flex-shrink: 0;
  }
  .file-status-dot.connected { background: #6BCB77; animation: pulseGlow 2s infinite; }
  .file-status-dot.unsaved { background: #FFD93D; animation: pulseWarn 1.5s infinite; }
  .file-status-dot.local { background: #4D96FF; }
  .file-status-text {
    flex: 1; color: rgba(255,255,255,0.8); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-file {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 4px 10px; border-radius: 8px;
    font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .btn-file:hover { background: rgba(255,255,255,0.35); }
  .btn-file.primary {
    background: rgba(107,203,119,0.4); border-color: rgba(107,203,119,0.6);
  }
  .btn-file.primary:hover { background: rgba(107,203,119,0.6); }

  /* ====== 成长宠物 ====== */
  .pet-panel {
    display: grid; grid-template-columns: 126px minmax(0, 1fr); gap: 14px;
    align-items: center; position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(255,249,214,0.98), rgba(218,255,232,0.96) 50%, rgba(225,239,255,0.96));
    border: 2px solid rgba(255,217,61,0.92); border-radius: 20px;
    padding: 14px; margin: 8px 0 12px;
    box-shadow: 0 18px 38px rgba(31, 18, 77, 0.22);
  }
  .pet-panel::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF);
  }
  .pet-visual {
    min-height: 132px; display: grid; place-items: center; position: relative;
  }
  .pet-avatar-img {
    width: 118px; height: 118px; object-fit: contain;
    animation: petWiggle 3.8s ease-in-out infinite, petGlow 3s ease-in-out infinite;
  }
  .pet-avatar-fallback {
    width: 112px; height: 112px; border-radius: 24px;
    background: linear-gradient(135deg, #FFF3B0, #A8E6CF);
    display: grid; place-items: center; font-size: 62px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.14);
    animation: petWiggle 3s ease-in-out infinite;
  }
  .pet-avatar-img[hidden],
  .pet-avatar-fallback[hidden] { display: none !important; }
  .pet-stage-badge {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    color: #2e2a4a; background: rgba(255,255,255,0.95);
    border: 1px solid rgba(255,217,61,0.85); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; font-weight: 900;
    box-shadow: 0 7px 16px rgba(64, 43, 86, 0.12);
  }
  .pet-info { min-width: 0; }
  .pet-title-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 5px;
  }
  .pet-name { color: #2e2a4a; font-size: 17px; font-weight: 900; }
  .pet-level {
    flex-shrink: 0; color: #fff; background: linear-gradient(135deg, #FF8A3D, #FF5E78);
    border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 900;
  }
  .pet-skill {
    color: #4a4560; font-size: 13px; line-height: 1.4;
    font-weight: 800;
  }
  .pet-progress {
    height: 6px; border-radius: 999px; overflow: hidden;
    background: rgba(65, 54, 91, 0.14); margin-top: 8px;
  }
  .pet-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6BCB77, #FFD93D, #FF8A3D);
    transition: width 0.5s ease;
  }
  .pet-progress-text {
    color: #6a637a; font-size: 11px; font-weight: 800;
    margin-top: 5px;
  }
  .pet-skill-list {
    display: flex; gap: 6px; overflow-x: auto; padding-top: 9px;
  }
  .pet-skill-chip {
    flex: 0 0 auto; border-radius: 999px; padding: 3px 7px;
    background: rgba(255,255,255,0.78); color: #4d4663;
    border: 1px solid rgba(118,75,162,0.12);
    font-size: 10px; font-weight: 800;
  }
  @media (max-width: 380px) {
    .pet-panel { grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 12px; }
    .pet-visual { min-height: 114px; }
    .pet-avatar-img { width: 100px; height: 100px; }
    .pet-avatar-fallback { width: 96px; height: 96px; font-size: 54px; }
    .pet-name { font-size: 15px; }
    .pet-skill { font-size: 12px; }
  }

  /* ====== 关卡 ====== */
  .level-bar {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding: 0 0 6px;
    margin-bottom: 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .level-bar::-webkit-scrollbar { height: 4px; }
  .level-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  .level-scroll-wrap {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    align-items: flex-start;
  }
  .level-scroll-wrap::-webkit-scrollbar { height: 4px; }
  .level-scroll-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  .level-section { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .level-section-label {
    font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.55);
    padding: 2px 8px; background: rgba(255,255,255,0.1);
    border-radius: 8px; white-space: nowrap; text-align: center;
  }
  .level-section-label.k { background: rgba(107,203,119,0.2); color: #6BCB77; }
  .level-section-label.g1s1 { background: rgba(77,150,255,0.2); color: #4D96FF; }
  .level-section-label.g1s2 { background: rgba(155,89,182,0.2); color: #9B59B6; }
  .level-row { display: flex; gap: 5px; }
  .level-btn {
    background: rgba(255,255,255,0.2); border: 2px solid transparent;
    border-radius: 12px; padding: 4px 10px; color: #fff;
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: all 0.3s; white-space: nowrap;
  }
  .level-btn:hover { background: rgba(255,255,255,0.35); }
  .level-btn.active {
    background: rgba(255,255,255,0.9); color: #764ba2;
    border-color: #fff; transform: scale(1.05);
  }
  .level-btn.lock { opacity: 0.45; cursor: default; }
  .level-btn.done { opacity: 0.7; }
  .level-btn.done::before { content: '✅ '; }

  /* ====== 进度条 ====== */
  .progress-wrap {
    background: rgba(255,255,255,0.2); border-radius: 10px;
    height: 6px; margin-bottom: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, #FFD93D, #FF6B6B);
    transition: width 0.5s ease;
  }

  /* ====== 模式切换 ====== */
  .mode-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .mode-btn {
    flex: 1; padding: 9px; border: 2px solid rgba(255,255,255,0.3);
    border-radius: 14px; background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.3s; text-align: center;
  }
  .mode-btn.active {
    background: rgba(255,255,255,0.9); color: #764ba2; border-color: #fff;
  }
  .mode-btn .mode-icon { font-size: 16px; display: block; margin-bottom: 1px; }
  .mode-btn .mode-sub { font-size: 10px; font-weight: 400; opacity: 0.8; }

  /* ====== 复习模式提示 ====== */
  .review-banner {
    background: linear-gradient(135deg, #FF6B6B, #FFD93D);
    border-radius: 14px; padding: 9px 16px;
    text-align: center; color: #fff; font-size: 12px; font-weight: 700;
    margin-bottom: 10px; animation: slideDown 0.3s ease;
  }
  .review-banner span { opacity: 0.9; font-weight: 400; font-size: 11px; }

  /* ====== 卡片区域 ====== */
  .card-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .char-card {
    width: 250px; height: 260px;
    background: #fff; border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    border: 4px solid transparent;
    animation: bounceIn 0.5s ease, rainbowBorder 4s linear infinite;
    transition: transform 0.3s;
  }
  .char-card:hover { transform: scale(1.02); }
  .char-card .char-bg {
    position: absolute; font-size: 170px; opacity: 0.06;
    font-weight: 900; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .char-card .pinyin {
    font-size: 26px; color: #FF6B6B; font-weight: 700;
    margin-bottom: 2px; position: relative; z-index: 1;
  }
  .char-card .character {
    font-size: 110px; font-weight: 900; color: #333;
    line-height: 1; position: relative; z-index: 1;
  }
  .char-card .hint {
    font-size: 13px; color: #999; margin-top: 6px;
    position: relative; z-index: 1;
  }
  .char-card .word-toggle {
    margin-top: 10px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid #FFD93D; background: #FFF7D6; color: #6b4f00;
    font-size: 12px; font-weight: 900; cursor: pointer;
    position: relative; z-index: 1; transition: transform 0.2s, background 0.2s;
  }
  .char-card .word-toggle:active { transform: scale(0.96); }
  .char-card .word-toggle[aria-expanded="true"] { background: #FFE89A; }
  .char-card .word-panel {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    max-width: 214px; margin-top: 8px; position: relative; z-index: 1;
  }
  .char-card .word-panel[hidden] { display: none; }
  .char-card .word-chip {
    border: 1px solid rgba(118,75,162,0.14); border-radius: 999px;
    background: #f6f2ff; color: #4c3f6d; padding: 5px 10px;
    font-size: 13px; font-weight: 800; cursor: pointer;
  }
  .char-card .word-chip:active { transform: scale(0.96); }
  .char-card .speaker {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none; color: #fff; font-size: 16px;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: transform 0.2s; z-index: 2;
  }
  .char-card .speaker:active { transform: scale(0.9); }
  .char-record-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,0.95); border-radius: 20px;
    padding: 2px 8px; font-size: 10px; font-weight: 700;
    display: flex; gap: 5px; z-index: 2; border: 1px solid #eee;
  }
  .char-record-badge .know { color: #6BCB77; }
  .char-record-badge .wrong { color: #FF6B6B; }

  /* ====== 按钮组 ====== */
  .btn-group { display: flex; gap: 14px; width: 100%; max-width: 300px; }
  .btn {
    flex: 1; padding: 14px 8px; border: none; border-radius: 18px;
    font-size: 17px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center;
    justify-content: center; gap: 5px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-no {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff; box-shadow: 0 6px 20px rgba(245,87,108,0.4);
  }
  .btn-yes {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff; box-shadow: 0 6px 20px rgba(79,172,254,0.4);
  }
  .btn-no:hover { box-shadow: 0 8px 30px rgba(245,87,108,0.6); transform: translateY(-2px); }
  .btn-yes:hover { box-shadow: 0 8px 30px rgba(79,172,254,0.6); transform: translateY(-2px); }
  .btn-listen {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #FFD93D, #FF6B6B);
    border: none; color: #fff; font-size: 22px;
    cursor: pointer; box-shadow: 0 6px 20px rgba(255,107,107,0.4);
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .btn-listen:active { transform: scale(0.9); }

  /* ====== 底部面板 ====== */
  .card-box-section { margin-top: 12px; padding-bottom: 20px; }
  .tab-bar { display: flex; gap: 8px; }
  .tab-btn {
    flex: 1; padding: 9px; border: 2px solid rgba(255,255,255,0.3);
    border-radius: 14px; background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.3s; text-align: center;
  }
  .tab-btn.active {
    background: rgba(255,255,255,0.9); color: #764ba2; border-color: #fff;
  }
  .tab-btn .tab-icon { font-size: 16px; display: block; margin-bottom: 1px; }
  .tab-btn .tab-sub { font-size: 10px; font-weight: 400; opacity: 0.8; }

  .card-box {
    max-height: 0; overflow: hidden; transition: max-height 0.5s ease;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
    border-radius: 16px; margin-top: 8px;
  }
  .card-box.open { max-height: 700px; }
  .card-box-inner { padding: 14px; }
  .card-box-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .card-box-header span { color: #fff; font-size: 12px; opacity: 0.8; }
  .btn-reset {
    background: rgba(255,100,100,0.3); border: 1px solid rgba(255,100,100,0.5);
    color: #fff; padding: 3px 10px; border-radius: 10px;
    font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .btn-reset:hover { background: rgba(255,100,100,0.5); }

  /* ====== 会认卡片 ====== */
  .mastered-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .mastered-item {
    background: rgba(255,255,255,0.9); border-radius: 10px;
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    animation: bounceIn 0.4s ease; position: relative;
    cursor: pointer; transition: transform 0.2s;
  }
  .mastered-item:hover { transform: scale(1.1); }
  .mastered-item .mc { font-size: 20px; font-weight: 900; color: #333; }
  .mastered-item .mp { font-size: 8px; color: #999; }
  .mastered-item .star { position: absolute; top: -3px; right: -3px; font-size: 12px; }
  .empty-box {
    color: rgba(255,255,255,0.5); text-align: center;
    padding: 20px; font-size: 13px;
  }

  /* ====== 识字记录列表 ====== */
  .record-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .record-header span { color: #fff; font-size: 12px; opacity: 0.8; }
  .record-filter { display: flex; gap: 5px; margin-bottom: 8px; }
  .filter-btn {
    padding: 3px 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);
    font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .filter-btn.active {
    background: rgba(255,255,255,0.9); color: #764ba2; border-color: #fff;
  }
  .record-list {
    display: flex; flex-direction: column; gap: 5px;
    max-height: 380px; overflow-y: auto;
  }
  .record-list::-webkit-scrollbar { width: 4px; }
  .record-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  .record-item {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,0.15); border-radius: 12px;
    padding: 9px 12px; animation: slideDown 0.3s ease;
    transition: transform 0.2s; cursor: pointer;
  }
  .record-item:hover { transform: scale(1.01); background: rgba(255,255,255,0.22); }
  .record-item .ri-left { display: flex; flex-direction: column; align-items: center; min-width: 46px; }
  .record-item .ri-char { font-size: 26px; font-weight: 900; color: #fff; line-height: 1; }
  .record-item .ri-pinyin { font-size: 9px; color: rgba(255,255,255,0.6); }
  .record-item .ri-mid { flex: 1; min-width: 0; }
  .record-item .ri-hint { font-size: 10px; color: rgba(255,255,255,0.45); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

function t(key, ...args) {
  const langPack = translations[state.currentLanguage] || translations.zh;
  const value = langPack[key] ?? translations.zh[key] ?? '';
  return typeof value === 'function' ? value(...args) : value;
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

function levelName(index) {
  return t('levelName', index + 1);
}

function charHint(data) {
  return state.currentLanguage === 'en' ? (EN_HINTS[data.char] || data.hint) : data.hint;
}

function wordGroupForChar(char) {
  return WORD_GROUPS[char] || [`${char}字`, `${char}词`, `学${char}`];
}

function renderWordPanel(data) {
  const btn = document.getElementById('btnWords');
  const panel = document.getElementById('wordPanel');
  if (!btn || !panel) return;

  btn.textContent = wordPanelVisible ? t('hideWords') : t('groupWords');
  btn.setAttribute('aria-expanded', wordPanelVisible ? 'true' : 'false');
  panel.hidden = !wordPanelVisible;
  panel.innerHTML = '';

  if (!wordPanelVisible || !data) return;
  wordGroupForChar(data.char).forEach(word => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'word-chip';
    chip.textContent = word;
    chip.onclick = (event) => {
      event.stopPropagation();
      doSpeak(word);
    };
    panel.appendChild(chip);
  });
}

function toggleWordPanel() {
  wordPanelVisible = !wordPanelVisible;
  renderWordPanel(state.currentQueue[state.currentCharIndex]);
  playSound('click');
}

function completedLevelNumbers() {
  return LEVELS
    .map((lv, i) => lv.chars.every(c => state.mastered[c.char]) ? i + 1 : null)
    .filter(Boolean);
}

function getPetSkill(level = state.petLevel) {
  const cappedLevel = Math.max(1, Math.min(level, PET_SKILLS[PET_SKILLS.length - 1].level));
  return [...PET_SKILLS].reverse().find(skill => skill.level <= cappedLevel) || PET_SKILLS[0];
}

function petImageForLevel(level = state.petLevel) {
  const cappedLevel = Math.max(1, Math.min(Number(level) || 1, PET_MAX_IMAGE_LEVEL));
  return PET_IMAGES[cappedLevel] || PET_IMAGES[1];
}

function petLevelFromCompletedCount(completedCount) {
  const level = Math.floor(Math.max(0, completedCount) / PET_LEVELS_PER_IMAGE) + 1;
  return Math.max(1, Math.min(level, PET_MAX_IMAGE_LEVEL));
}

function getUnlockedPetSkills() {
  return PET_SKILLS.filter(skill => skill.level <= state.petLevel);
}

function petSkillText(skill) {
  return state.currentLanguage === 'en' ? skill.en : skill.zh;
}

function syncPetFromProgress(showUnlock = false, completedLevelNumber = null) {
  const completed = completedLevelNumbers();
  if (!state.petClaimedLevels || typeof state.petClaimedLevels !== 'object') {
    state.petClaimedLevels = {};
  }

  const previousPetLevel = state.petLevel || 1;
  if (!completedLevelNumber) {
    completed.forEach(level => { state.petClaimedLevels[level] = true; });
  } else if (!state.petClaimedLevels[completedLevelNumber]) {
    state.petClaimedLevels[completedLevelNumber] = true;
  }

  const claimedCount = Object.keys(state.petClaimedLevels).length;
  state.petLevel = petLevelFromCompletedCount(claimedCount);
  const unlockedSkill = state.petLevel > previousPetLevel ? getPetSkill(state.petLevel) : null;
  return showUnlock ? unlockedSkill : null;
}

function renderPetPanel() {
  const skill = getPetSkill();
  const completedCount = completedLevelNumbers().length;
  const pct = Math.min(100, (completedCount / LEVELS.length) * 100);
  const level = state.petLevel || 1;
  const image = document.getElementById('petAvatarImg');
  const fallback = document.getElementById('petAvatarFallback');
  if (image) {
    image.onerror = () => {
      image.hidden = true;
      if (fallback) fallback.hidden = false;
    };
    image.onload = () => {
      image.hidden = false;
      if (fallback) fallback.hidden = true;
    };
    image.src = petImageForLevel(level);
    image.alt = t('petImageAlt', Math.min(level, PET_MAX_IMAGE_LEVEL));
  }
  if (fallback) fallback.textContent = skill.emoji;
  setText('petName', t('petName'));
  setText('petLevel', t('petLevel', level));
  setText('petStageBadge', t('petLevel', Math.min(level, PET_MAX_IMAGE_LEVEL)));
  setText('petSkill', petSkillText(skill || PET_SKILLS[0]));
  const fill = document.getElementById('petProgressFill');
  if (fill) fill.style.width = pct + '%';
  setText('petProgressText', t('petProgress', completedCount, LEVELS.length));
  const list = document.getElementById('petSkillList');
  if (list) {
    list.innerHTML = getUnlockedPetSkills()
      .slice(-4)
      .map(item => `<span class="pet-skill-chip">${item.emoji} ${petSkillText(item)}</span>`)
      .join('');
    list.title = t('petProgress', completedCount, LEVELS.length);
  }
}

// ====== IndexedDB 存储句柄 ======
const DB_NAME = 'charGameDB';
const STORE_NAME = 'handles';
const HANDLE_KEY = 'csvFileHandle';

function csvHandleKey() {
  return HANDLE_KEY;
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onerror = reject;
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

async function saveHandle(handle) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(handle, csvHandleKey());
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

async function loadHandle() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(csvHandleKey());
      req.onsuccess = () => resolve(req.result);
      req.onerror = reject;
    });
  } catch(e) { return null; }
}

async function clearHandle() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(csvHandleKey());
      tx.oncomplete = resolve;
      tx.onerror = reject;
    });
  } catch(e) {}
}

// ====== CSV 读取 & 解析 ======
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return {};
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(',');
    if (parts.length < 4) continue;
    const char = parts[0].trim();
    const know = parseInt(parts[2]) || 0;
    const wrong = parseInt(parts[3]) || 0;
    result[char] = { know, wrong, lastTime: Date.now() };
  }
  return result;
}

// ====== CSV 生成 ======
function generateCSV() {
  const allChars = LEVELS.flatMap(l => l.chars);
  const lines = ['字,拼音,认识次数,错误次数,状态,难度,第几关'];
  allChars.forEach(c => {
    const rec = state.records[c.char] || { know: 0, wrong: 0 };
    const level = LEVELS.findIndex(lv => lv.chars.some(ch => ch.char === c.char)) + 1;
    const isMastered = !!state.mastered[c.char];
    const status = isMastered ? '已认' : (rec.know > 0 ? '学习中' : '未学');
    const err = rec.wrong >= 3 ? '困难' : rec.wrong >= 1 ? '一般' : '轻松';
    lines.push(`${c.char},${c.pinyin},${rec.know},${rec.wrong},${status},${err},第${level}关`);
  });
  return '﻿' + lines.join('\n');
}

// ====== 打开 CSV 文件 ======
async function openCsvFile() {
  // 不支持 File System Access API
  if (!('showOpenFilePicker' in window)) {
    alert(t('unsupportedCsv'));
    return;
  }

  try {
    const handles = await window.showOpenFilePicker({
      types: [{ description: t('csvFileDescription'), accept: { 'text/csv': ['.csv'] } }],
      multiple: false,
    });
    const handle = handles[0];
    csvState.handle = handle;
    csvState.fileName = handle.name;
    csvState.isConnected = true;
    csvState.isDirty = false;

    // 保存句柄到 IndexedDB
    await saveHandle(handle);

    // 读取文件内容
    const file = await handle.getFile();
    const text = await file.text();
    const csvRecords = parseCSV(text);

    // 合并：CSV 有就用CSV的，本地没有的字也要加进来
    Object.keys(csvRecords).forEach(ch => {
      if (!state.records[ch]) {
        state.records[ch] = csvRecords[ch];
      } else {
        // 本地记录比CSV多就用本地的
        if (state.records[ch].know > csvRecords[ch].know) {
          csvRecords[ch].know = state.records[ch].know;
        }
        if (state.records[ch].wrong > csvRecords[ch].wrong) {
          csvRecords[ch].wrong = state.records[ch].wrong;
        }
        state.records[ch] = csvRecords[ch];
      }
      if (csvRecords[ch].know > 0 && csvRecords[ch].wrong === 0) {
        // CSV里认识的字自动标记会认
        state.mastered[ch] = true;
      }
    });
    syncPetFromProgress(false);

    updateFileStatusUI('connected');
    updateUI();
    playSound('correct');

  } catch(e) {
    if (e.name !== 'AbortError') {
      console.error('打开文件失败:', e);
      updateFileStatusUI('local');
    }
  }
}

// ====== 自动恢复上次文件 ======
async function autoReconnectLastFile() {
  if (!('showOpenFilePicker' in window)) return;

  try {
    const handle = await loadHandle();
    if (!handle) { updateFileStatusUI('local'); return; }

    // 检查是否还能用（可能文件被删了或移动了）
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        csvState.handle = handle;
        csvState.fileName = handle.name;
        csvState.isConnected = true;

        const file = await handle.getFile();
        const text = await file.text();
        const csvRecords = parseCSV(text);

        Object.keys(csvRecords).forEach(ch => {
          if (!state.records[ch]) {
            state.records[ch] = csvRecords[ch];
          } else {
            if (state.records[ch].know > csvRecords[ch].know) {
              csvRecords[ch].know = state.records[ch].know;
            }
            if (state.records[ch].wrong > csvRecords[ch].wrong) {
              csvRecords[ch].wrong = state.records[ch].wrong;
            }
            state.records[ch] = csvRecords[ch];
          }
          if (csvRecords[ch].know > 0 && csvRecords[ch].wrong === 0) {
            state.mastered[ch] = true;
          }
        });
        syncPetFromProgress(false);

        updateFileStatusUI('connected');
        updateUI();
        return;
      }
    } catch(e) {
      // 句柄失效，清理
      await clearHandle();
    }

    updateFileStatusUI('local');
  } catch(e) {
    updateFileStatusUI('local');
  }
}

// ====== 写入 CSV ======
async function syncToCsv() {
  if (!csvState.isConnected || !csvState.handle) return;
  try {
    const writable = await csvState.handle.createWritable();
    await writable.write(generateCSV());
    await writable.close();
    csvState.isDirty = false;
    updateFileStatusUI('connected');
  } catch(e) {
    console.error('写入CSV失败:', e);
    csvState.isDirty = true;
    updateFileStatusUI('unsaved');
  }
}

// ====== 手动保存 ======
async function saveCsvFile() {
  if (!('showOpenFilePicker' in window)) {
    // 不支持API时，用传统方式下载
    const blob = new Blob([generateCSV()], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = CSV_FILENAME;
    a.click();
    URL.revokeObjectURL(url);
    playSound('correct');
    return;
  }

  if (csvState.isConnected && csvState.handle) {
    await syncToCsv();
    playSound('correct');
  } else {
    // 还没连上，直接另存为
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: CSV_FILENAME,
        types: [{ description: t('csvFileDescription'), accept: { 'text/csv': ['.csv'] } }],
      });
      csvState.handle = handle;
      csvState.fileName = handle.name;
      csvState.isConnected = true;
      await saveHandle(handle);
      await syncToCsv();
      updateFileStatusUI('connected');
      playSound('correct');
    } catch(e) {
      if (e.name !== 'AbortError') console.error('保存失败:', e);
    }
  }
}

// ====== 文件状态 UI ======
function updateFileStatusUI(status) {
  csvState.status = status || 'local';
  const dot = document.getElementById('fileStatusDot');
  const text = document.getElementById('fileStatusText');
  const btnOpen = document.getElementById('btnOpenCsv');

    btnOpen.textContent = t('openCsv');

}

// ====== 每次操作后自动同步 ======
function markDirty() {
  csvState.isDirty = true;
  if (csvState.isConnected) updateFileStatusUI('unsaved');

  clearTimeout(window._syncTimer);

}

// ====== 本地存储 ======
function cachedAccountState() {
  const accountName = localStorage.getItem('charGameCurrentUser');
  return accountName ? localStorage.getItem(`charGame2:user:${accountName}`) : '';
}

function loadState() {
  try {
    const savedLanguage = localStorage.getItem('charGameLanguage');
    if (savedLanguage === 'zh' || savedLanguage === 'en') state.currentLanguage = savedLanguage;
    const saved = localStorage.getItem('charGame2') || cachedAccountState();
    if (saved) {
      const s = JSON.parse(saved);
      state.mastered = s.mastered || {};
      state.stars = s.stars || 0;
      state.records = s.records || {};
      state.petLevel = s.petLevel || 1;
      state.petClaimedLevels = s.petClaimedLevels || {};
      if (!savedLanguage && (s.currentLanguage === 'zh' || s.currentLanguage === 'en')) {
        state.currentLanguage = s.currentLanguage;
      }
      LEVELS.forEach((lv, i) => {
        if (i === 0) return;
        const prevChars = LEVELS[i-1].chars;
        if (prevChars.every(c => state.mastered[c.char])) lv.unlocked = true;
      });
      syncPetFromProgress(false);
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('charGame2', JSON.stringify({
      mastered: state.mastered,
      stars: state.stars,
      records: state.records,
      currentLanguage: state.currentLanguage,
      petLevel: state.petLevel,
      petClaimedLevels: state.petClaimedLevels,
    }));
  } catch(e) {}
}

function getRecord(char) {
  if (!state.records[char]) {
    state.records[char] = { know: 0, wrong: 0, lastTime: 0 };
  }
  return state.records[char];
}

// ====== 语音 ======
function doSpeak(charOverride) {
  const data = state.currentQueue[state.currentCharIndex];
  const char = charOverride || (data && data.char);
  if (!char) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(char);
  u.lang = 'zh-CN'; u.rate = 0.7; u.pitch = 1.2;
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.includes('zh') && v.name.includes('female'))
    || voices.find(v => v.lang.includes('zh-CN'))
    || voices.find(v => v.lang.includes('zh'));
  if (zhVoice) u.voice = zhVoice;
  window.speechSynthesis.speak(u);
}

// ====== 音效 ======
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    } else if (type === 'wrong') {
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'click') {
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.start(); osc.stop(ctx.currentTime + 0.1);
    }
  } catch(e) {}
}

// ====== 构建队列 ======
function buildQueue() {
  const lv = LEVELS[state.currentLevel];

  if (state.currentMode === 'review') {
    const charsWithWrong = lv.chars.map(c => {
      const rec = getRecord(c.char);
      return { ...c, wrongCount: rec.wrong, knowCount: rec.know };
    });
    charsWithWrong.sort((a, b) => {
      if (b.wrongCount !== a.wrongCount) return b.wrongCount - a.wrongCount;
      return a.knowCount - b.knowCount;
    });
    state.currentQueue = charsWithWrong;
    const hardChars = charsWithWrong.filter(c => c.wrongCount >= 2);
    document.getElementById('reviewInfo').textContent = t('reviewInfo', hardChars.length);
  } else {
    const unmastered = lv.chars.filter(c => !state.mastered[c.char]);
    const mastered = lv.chars.filter(c => state.mastered[c.char]);
    state.currentQueue = [...shuffle(unmastered), ...shuffle(mastered)];
  }
  state.currentCharIndex = 0;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showChar(data) {
  wordPanelVisible = false;
  document.getElementById('pinyin').textContent = data.pinyin;
  document.getElementById('character').textContent = data.char;
  document.getElementById('hint').textContent = charHint(data) + ' ' + data.emoji;
  document.getElementById('charBg').textContent = data.char;
  renderWordPanel(data);

  const rec = getRecord(data.char);
  document.getElementById('charKnowCount').textContent = rec.know;
  document.getElementById('charWrongCount').textContent = rec.wrong;

  const card = document.getElementById('charCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'bounceIn 0.5s ease, rainbowBorder 4s linear infinite';

  setTimeout(() => doSpeak(), 300);
}

function nextChar() {
  if (state.currentQueue.length === 0) { showCelebration(); return; }
  if (state.currentCharIndex >= state.currentQueue.length) state.currentCharIndex = 0;
  showChar(state.currentQueue[state.currentCharIndex]);
}

// ====== 认识啦 ======
function handleKnow() {
  const data = state.currentQueue[state.currentCharIndex];
  if (!data) return;

  const rec = getRecord(data.char);
  rec.know++;
  rec.lastTime = Date.now();

  if (!state.mastered[data.char]) {
    state.mastered[data.char] = true;
    state.stars++;
    playSound('correct');
    state.currentQueue.splice(state.currentCharIndex, 1);

    const card = document.getElementById('charCard');
    const rect = card.getBoundingClientRect();
    spawnConfetti(15);
    spawnStars(rect.left + rect.width/2, rect.top + rect.height/2, 8);
    checkLevelUnlock();
  } else {
    playSound('click');
    state.currentQueue.splice(state.currentCharIndex, 1);
  }

  saveState();
  markDirty();
  updateUI();
  nextChar();
}

// ====== 不认识 ======
function handleDontKnow() {
  const data = state.currentQueue[state.currentCharIndex];
  if (!data) return;

  const rec = getRecord(data.char);
  rec.wrong++;
  rec.lastTime = Date.now();
  playSound('wrong');

  const item = state.currentQueue.splice(state.currentCharIndex, 1)[0];
  const insertPos = state.currentCharIndex + Math.floor(Math.random() * 3) + 1;
  state.currentQueue.splice(Math.min(insertPos, state.currentQueue.length), 0, item);

  const card = document.getElementById('charCard');
  card.style.animation = 'shake 0.4s ease';
  setTimeout(() => card.style.animation = 'bounceIn 0.5s ease, rainbowBorder 4s linear infinite', 400);
  setTimeout(() => doSpeak(), 500);

  saveState();
  markDirty();
  updateUI();
  nextChar();
}

// ====== 检查关卡解锁 ======
function checkLevelUnlock() {
  LEVELS.forEach((lv, i) => {
    if (i === 0 || lv.unlocked) return;
    const prevChars = LEVELS[i-1].chars;
    const allMastered = prevChars.every(c => state.mastered[c.char]);
    if (allMastered) {
      lv.unlocked = true;
      setTimeout(() => { spawnConfetti(50); alert(t('unlockedAlert', levelName(i))); }, 500);
    }
  });
}

    <div class="celebration-box">
      <div class="big-emoji">🏆</div>
      <h2>${t('celebrationTitle')}</h2>

      ${petUnlock ? `
        <div class="pet-unlock">
          <div class="pet-unlock-top">
            <img class="pet-unlock-avatar" src="${petImageForLevel(state.petLevel)}" alt="${t('petImageAlt', Math.min(state.petLevel || 1, PET_MAX_IMAGE_LEVEL))}">
            <div>
              <h3>${t('petSkillUnlockedTitle', state.petLevel)}</h3>

        <div class="stat-item"><div class="stat-num">⭐${state.stars}</div><div class="stat-label">${t('totalStars')}</div></div>
      </div>

    nextChar();
    updateUI();

// ====== 识字记录渲染 ======
function renderRecordList() {
  const list = document.getElementById('recordList');
  const allChars = LEVELS.flatMap(l => l.chars);
  const filter = state.currentFilter;

  let items = allChars.map(c => ({
    ...c,
    rec: getRecord(c.char),
    isMastered: !!state.mastered[c.char],
    level: LEVELS.findIndex(lv => lv.chars.some(ch => ch.char === c.char)) + 1,
  }));

  if (filter === 'hard') {
    items = items.filter(it => it.rec.wrong >= 2);
    items.sort((a, b) => b.rec.wrong - a.rec.wrong);
  } else if (filter === 'mastered') {
    items = items.filter(it => it.isMastered);
    items.sort((a, b) => b.rec.know - a.rec.know);
  } else if (filter === 'new') {
    items = items.filter(it => !it.isMastered && it.rec.know === 0 && it.rec.wrong === 0);
  }

  if (items.length === 0) {
    list.innerHTML = `<div class="record-empty">${t('recordEmpty')}</div>`;
    return;
  }

  list.innerHTML = items.map(it => {
    const { rec, isMastered, level, char, pinyin, hint } = it;
    const total = rec.know + rec.wrong;
    const knowPct = total > 0 ? (rec.know / total * 100) : 50;
    let badgeClass = 'easy', badgeText = t('difficultyEasy');
    if (rec.wrong >= 3) { badgeClass = 'hard'; badgeText = t('difficultyHard'); }
    else if (rec.wrong >= 1) { badgeClass = 'medium'; badgeText = t('difficultyMedium'); }
    if (isMastered && rec.wrong < 3) { badgeClass = 'mastered'; badgeText = t('mastered'); }
    const barColor = rec.wrong >= 3 ? '#FF6B6B' : rec.wrong >= 1 ? '#FFD93D' : '#6BCB77';

    return `<div class="record-item" onclick="doSpeak('${char}')">
      <div class="ri-left">
        <div class="ri-char">${char}</div>
        <div class="ri-pinyin">${pinyin}</div>
      </div>
      <div class="ri-mid">
        <div class="ri-hint">${charHint(it)}</div>
        <div class="ri-bar-wrap"><div class="ri-bar-fill" style="width:${knowPct}%;background:${barColor}"></div></div>
      </div>
      <div class="ri-right">
        <span class="ri-badge ${badgeClass}">${badgeText}</span>
        <div class="ri-count"><strong>${rec.know}</strong>/<span class="w-strong">${rec.wrong}</span></div>
        <span class="ri-lv-badge">${t('levelBadge', level)}</span>
      </div>
    </div>`;
  }).join('');
}

// ====== UI 更新 ======
function updateUI() {
  const masteredCount = Object.keys(state.mastered).length;
  const totalWrong = Object.values(state.records).reduce((s, r) => s + (r.wrong || 0), 0);

  document.getElementById('starCount').textContent = state.stars;
  document.getElementById('knowCount').textContent = masteredCount;
  document.getElementById('wrongTotal').textContent = totalWrong;
  document.getElementById('boxCount2').textContent = t('cardCount', masteredCount);

  renderLevels();

  const lv = LEVELS[state.currentLevel];
  const masteredInLv = lv.chars.filter(c => state.mastered[c.char]).length;
  const pct = (masteredInLv / lv.chars.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';

  renderPetPanel();
  renderMasteredGrid();
}

function renderLevels() {
  const bar = document.getElementById('levelBar');
  bar.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const btn = document.createElement('button');
    btn.className = 'level-btn' + (i === state.currentLevel ? ' active' : '') + (!lv.unlocked ? ' lock' : '');
    const name = levelName(i);
    btn.textContent = lv.unlocked ? name : t('lockedLevel', name);
    btn.onclick = () => {
      if (!lv.unlocked) return;
      playSound('click');
      state.currentLevel = i;
      buildQueue();
      nextChar();
      updateUI();
    };
    bar.appendChild(btn);
  });
}

function renderMasteredGrid() {
  const grid = document.getElementById('masteredGrid');
  const empty = document.getElementById('emptyBox');
  const keys = Object.keys(state.mastered);
  if (keys.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';
  grid.innerHTML = '';
  const allChars = LEVELS.flatMap(l => l.chars);
  keys.forEach(ch => {
    const info = allChars.find(c => c.char === ch);
    if (!info) return;
    const item = document.createElement('div');
    item.className = 'mastered-item';
    item.innerHTML = `<div class="star">⭐</div><div class="mp">${info.pinyin}</div><div class="mc">${info.char}</div>`;
    item.onclick = (e) => { doSpeak(ch); spawnStars(e.clientX, e.clientY, 3); };
    const rec = getRecord(ch);
    item.title = t('itemTitle', rec.know, rec.wrong);
    grid.appendChild(item);
  });
}

// ====== 初始化 ======
function init() {
  loadState();

  // 背景装饰
  const decos = ['🌟', '⭐', '🌈', '🎈', '🎵', '🌸', '🦋', '🍭', '📚', '🎨', '🐱', '🐰'];
  const bgDeco = document.getElementById('bgDeco');
  for (let i = 0; i < 20; i++) {
    const span = document.createElement('span');
    span.textContent = decos[i % decos.length];
    span.style.left = Math.random() * 100 + '%';
    span.style.top = Math.random() * 100 + '%';
    span.style.animationDelay = (Math.random() * 5) + 's';
    span.style.fontSize = (18 + Math.random() * 18) + 'px';
    bgDeco.appendChild(span);
  }

  // 语音预加载
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // 按钮事件
  document.getElementById('btnLanguage').onclick = switchLanguage;
  document.getElementById('btnYes').onclick = handleKnow;
  document.getElementById('btnNo').onclick = handleDontKnow;
  document.getElementById('btnWords').onclick = (event) => {
    event.stopPropagation();
    toggleWordPanel();
  };
  document.getElementById('charCard').onclick = doSpeak;

  document.getElementById('btnReset').onclick = () => {
    if (confirm(t('resetConfirm'))) {
      state.mastered = {};
      state.stars = 0;
      state.records = {};
      state.petLevel = 1;
      state.petClaimedLevels = {};
      saveState();
      markDirty();
      LEVELS.forEach((lv, i) => lv.unlocked = i === 0);
      buildQueue();
      nextChar();
      updateUI();
    }
  };

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); handleKnow(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); handleDontKnow(); }
  });

  // 先显示本地模式，然后尝试自动恢复上次CSV。
  updateFileStatusUI('local');
  autoReconnectLastFile();

  buildQueue();
  nextChar();
  updateUI();
  applyI18n();
}

init();
</script>
